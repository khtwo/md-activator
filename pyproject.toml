[project]
name = "md-activator"
version = "0.1.4"
description = "MD Activator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "markdown>=3.6",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "win11toast>=0.32 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp_codex_run"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
